<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Encrypted Sibling Protocol...</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Syne:wght@700;800&family=WindSong:wght@500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-dark: #020005;
            --panel-bg: rgba(10, 5, 22, 0.5);
            --neon-pink: #ff2a85;
            --neon-purple: #9d4edf;
            --neon-cyan: #00f5ff;
            --glass-border: rgba(157, 78, 223, 0.22);
            --text-glow: 0 0 15px rgba(255, 42, 133, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        html, body {
            width: 100%;
            overflow-x: hidden;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 50%, #0c041c 0%, #010003 100%);
            position: relative;
        }

        body::before, body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(157, 78, 223, 0.12) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            animation: floatOrbs 12s infinite alternate ease-in-out;
            pointer-events: none;
        }

        body::before { top: -10%; left: -10%; }
        body::after { bottom: -10%; right: -10%; animation-delay: -6s; }

        @keyframes floatOrbs {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.2); }
        }

        /* ===== MODALS ===== */
        #gate-screen, #confirm-modal, #inbox-modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020005;
            transition: all 0.9s ease;
        }

        #confirm-modal, #inbox-modal {
            z-index: 10001;
            background: rgba(2, 0, 5, 0.94);
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
        }

        #confirm-modal.active, #inbox-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .gate-content, .modal-content {
            width: 90%;
            max-width: 450px;
            padding: 40px 25px;
            border-radius: 24px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            text-align: center;
        }

        .passcode-input {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            letter-spacing: 3px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.6);
            color: #fff;
        }

        .gate-btn, .confirm-btn {
            width: 100%;
            margin-top: 12px;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: white;
            font-weight: 700;
        }

        /* ===== NOTIFICATION ===== */
        #notification-popup {
            position: fixed;
            bottom: -150px;
            right: 20px;
            max-width: 320px;
            background: rgba(18, 10, 36, 0.85);
            border: 2px solid var(--neon-pink);
            border-radius: 18px;
            padding: 15px;
            display: flex;
            gap: 12px;
            z-index: 9999;
        }

        #notification-popup.pop {
            bottom: 20px;
        }

        /* ===== BANNER ===== */
        #birthday-banner {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            opacity: 0;
            pointer-events: none;
        }

        #birthday-banner.run {
            opacity: 1;
            pointer-events: auto;
        }

        .anim-title {
            font-family: 'Syne';
            font-size: 6rem;
            line-height: 1;
        }

        /* ===== NAV ===== */
        nav {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(2,0,5,0.85);
            backdrop-filter: blur(20px);
        }

        .nav-btn {
            font-size: 0.75rem;
            padding: 8px 12px;
            border: none;
            background: transparent;
            color: #aaa;
        }

        .nav-btn.active {
            color: #fff;
        }

        /* ===== PAGES ===== */
        .page {
            display: none;
            padding: 120px 15px 80px;
            max-width: 1100px;
            margin: auto;
        }

        .page.active {
            display: block;
        }

        /* ===== TITLES ===== */
        .title-main {
            font-size: 3rem;
            text-align: center;
        }

        .title-cursive {
            font-size: 3.5rem;
            text-align: center;
        }

        .letter-box {
            padding: 25px;
            font-size: 1rem;
        }

        .chapter-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .chapter-card {
            padding: 25px;
        }

        .wishes-masonry {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        /* ===== CANVAS ===== */
        #ambient-canvas {
            position: fixed;
            inset: 0;
            z-index: 0;
        }

        /* ===== MOBILE FIXES ===== */
        @media (max-width: 768px) {

            .anim-title {
                font-size: 2.8rem;
            }

            .title-main {
                font-size: 2.2rem;
            }

            .title-cursive {
                font-size: 2.6rem;
            }

            .gate-content, .modal-content {
                padding: 25px 18px;
            }

            .letter-box {
                padding: 18px;
                font-size: 0.95rem;
            }

            .page {
                padding-top: 110px;
            }

            #notification-popup {
                right: 10px;
                left: 10px;
                width: auto;
            }

            nav {
                gap: 6px;
            }

            .nav-btn {
                font-size: 0.65rem;
                padding: 6px 8px;
            }
        }
    </style>
</head>

<canvas id="ambient-canvas"></canvas>
