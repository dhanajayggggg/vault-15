<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vault 15</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .vault-container {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 360px;
            background: rgba(10, 10, 18, 0.75);
            border: 1px solid rgba(138, 43, 226, 0.25);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 30px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5), 
                        0 0 30px rgba(138, 43, 226, 0.15);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        h2 {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        .subtitle {
            color: #8a92b2;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            color: #a3aed0;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            padding-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(20, 20, 35, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #8a2be2;
            background: rgba(20, 20, 35, 0.9);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.25);
        }

        .btn-access {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #8a2be2, #4a00e0);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(138, 43, 226, 0.3);
            transition: all 0.2s ease;
            margin-top: 8px;
        }

        .btn-access:active {
            transform: scale(0.97);
            opacity: 0.9;
        }

        /* Modal Popup System */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 6, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 10;
            opacity: 0;
            visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            width: 85%;
            max-width: 340px;
            background: #0d0d18;
            border: 1px solid rgba(0, 255, 200, 0.3);
            border-radius: 20px;
            padding: 24px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.15);
            transform: scale(0.85);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-box {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 32px;
            margin-bottom: 12px;
            display: inline-block;
        }

        .modal-title {
            color: #00ffc8;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .modal-desc {
            color: #b0b9d6;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-close {
            padding: 10px 24px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-close:active {
            background: rgba(255,255,255,0.05);
        }

        .error-shake {
            animation: shake 0.4s ease;
            border-color: #ff3b30 !important;
            box-shadow: 0 0 15px rgba(255, 59, 48, 0.2) !important;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            50% { transform: translateX(6px); }
            75% { transform: translateX(-4px); }
        }
    </style>
</head>
<body>

    <canvas id="particleCanvas"></canvas>

    <div class="vault-container" id="vaultCard">
        <h2>VAULT-15</h2>
        <div class="subtitle">Enter decryption keys to initialize</div>
        
        <div class="input-group">
            <label>Name Identifier</label>
            <input type="text" id="usernameInput" placeholder="Enter name" autocomplete="off" spellcheck="false">
        </div>

        <div class="input-group">
            <label>Access Code</label>
            <input type="password" id="passcodeInput" placeholder="••••" inputmode="numeric" pattern="[0-9]*">
        </div>

        <button class="btn-access" onclick="verifyAccess()">Decrypt Identity</button>
    </div>

    <!-- Surprise Modal Overlay -->
    <div class="modal-overlay" id="alertModal">
        <div class="modal-box">
            <span class="modal-icon">✨</span>
            <div class="modal-title" id="modalTitle">Access Granted</div>
            <div class="modal-desc" id="modalBody">Welcome back to the secure environment.</div>
            <button class="modal-close" onclick="closeModal()">Acknowledge</button>
        </div>
    </div>

    <script>
        // Background Particles
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function initCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        initCanvas();

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.4 - 0.2;
                this.speedY = Math.random() * 0.4 - 0.2;
                this.alpha = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = `rgba(138, 43, 226, ${this.alpha})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function spawnParticles() {
            particles = [];
            const count = Math.min(60, Math.floor((canvas.width * canvas.height) / 12000));
            for(let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }
        spawnParticles();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            initCanvas();
            spawnParticles();
        });

        // Authentication & Pop-up Handling
        function verifyAccess() {
            const userField = document.getElementById('usernameInput');
            const passField = document.getElementById('passcodeInput');
            const card = document.getElementById('vaultCard');

            const userVal = userField.value.trim().toLowerCase();
            const passVal = passField.value.trim();

            if ((userVal === 'aarna' && passVal === '15') || (userVal === 'kavish' && passVal === '15')) {
                showModal("Access Granted ✨", "Verification successful! Redirecting to 8th A main directory... Welcome to the core framework.");
            } else {
                // Trigger bad input interface bounce
                card.classList.add('error-shake');
                userField.style.borderColor = '#ff3b30';
                passField.style.borderColor = '#ff3b30';
                
                setTimeout(() => {
                    card.classList.remove('error-shake');
                }, 400);
            }
        }

        // Clean error display reset on focus
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                document.getElementById('usernameInput').style.borderColor = '';
                document.getElementById('passcodeInput').style.borderColor = '';
            });
        });

        function showModal(title, text) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalBody').innerText = text;
            document.getElementById('alertModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('alertModal').classList.remove('active');
        }
    </script>
</body>
</html>
