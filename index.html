<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔒 Encrypted Sibling Protocol...</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&family=Syne:wght@700;800&family=WindSong:wght@500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #020005;
            --panel-bg: rgba(10, 5, 22, 0.5);
            --neon-pink: #ff2a85;
            --neon-purple: #9d4edf;
            --neon-cyan: #00f5ff;
            --glass-border: rgba(157, 78, 223, 0.22);
            --text-glow: 0 0 15px rgba(255, 42, 133, 0.6);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            overflow-x: hidden;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 50%, #0c041c 0%, #010003 100%);
        }

        body::before, body::after {
            content: '';
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(157, 78, 223, 0.12) 0%, rgba(0,0,0,0) 70%);
            z-index: -1;
            animation: floatOrbs 12s infinite alternate ease-in-out;
        }

        body::before { top: -10%; left: -10%; }
        body::after { bottom: -10%; right: -10%; animation-delay: -6s; }

        @keyframes floatOrbs {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(60px, 40px) scale(1.2); }
        }

        /* ===== GATE + MODALS ===== */
        #gate-screen, #confirm-modal, #inbox-modal {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: #020005;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #confirm-modal, #inbox-modal {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.8);
            transition: 0.5s;
            background: rgba(2,0,5,0.94);
        }

        #confirm-modal.active, #inbox-modal.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        .gate-content, .modal-content {
            width: 90%;
            max-width: 450px;
            padding: 40px;
            border-radius: 30px;
            background: var(--panel-bg);
            backdrop-filter: blur(30px);
            border: 1px solid var(--glass-border);
        }

        /* ===== INPUT ===== */
        .passcode-input {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            text-align: center;
            font-size: 1.1rem;
            letter-spacing: 4px;
        }

        .gate-btn, .confirm-btn {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: none;
            font-weight: 700;
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
            color: #fff;
        }

        /* ===== NOTIFICATION ===== */
        #notification-popup {
            position: fixed;
            bottom: 20px;
            right: 20px;
            max-width: 380px;
            background: rgba(18,10,36,0.85);
            border: 2px solid var(--neon-pink);
            border-radius: 20px;
            padding: 16px;
        }

        /* ===== BIRTHDAY ===== */
        #birthday-banner {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .anim-title {
            font-size: 6rem;
            text-align: center;
        }

        /* ===== NAV ===== */
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 20px;
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(2,0,5,0.8);
            overflow-x: auto;
        }

        .nav-btn {
            white-space: nowrap;
            font-size: 0.9rem;
        }

        /* ===== PAGES ===== */
        .page {
            display: none;
            padding: 160px 20px 80px;
            max-width: 1150px;
            margin: auto;
        }

        .page.active { display: block; }

        /* ===== TITLES ===== */
        .title-main { font-size: 6rem; text-align: center; }
        .title-cursive { font-size: 8rem; text-align: center; }

        /* ===== LETTER BOX ===== */
        .letter-box {
            padding: 50px;
            background: var(--panel-bg);
            border-radius: 30px;
        }

        /* ===== CHAPTERS ===== */
        .chapter-card {
            padding: 40px;
            border-radius: 25px;
            background: var(--panel-bg);
        }

        /* ===== WISHES ===== */
        .wishes-masonry {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .aesthetic-wish {
            padding: 35px;
            border-radius: 25px;
        }

        /* ===== CANVAS ===== */
        #ambient-canvas {
            position: fixed;
            inset: 0;
            z-index: 999;
        }

        /* ===========================
           📱 MOBILE FIXES
        =========================== */

        @media (max-width: 768px) {

            .title-main { font-size: 2.8rem; }
            .title-cursive { font-size: 3rem; }

            .anim-title { font-size: 2.5rem; }

            .page {
                padding: 120px 15px 60px;
            }

            .letter-box {
                padding: 20px;
                font-size: 1rem;
            }

            nav {
                justify-content: flex-start;
            }

            .nav-btn {
                font-size: 0.75rem;
            }

            .wishes-masonry {
                grid-template-columns: 1fr;
            }

            .chapter-card {
                padding: 25px;
            }

            .aesthetic-wish {
                padding: 20px;
            }

            .gate-content, .modal-content {
                padding: 25px;
            }
        }

        @media (max-width: 480px) {

            .title-main { font-size: 2.2rem; }
            .title-cursive { font-size: 2.4rem; }
            .anim-title { font-size: 2rem; }

            .letter-box {
                padding: 15px;
            }

            .gate-btn, .confirm-btn {
                padding: 14px;
                font-size: 0.9rem;
            }
        }

        html, body {
            overflow-x: hidden;
            max-width: 100%;
        }

    </style>
</head>

</html>
